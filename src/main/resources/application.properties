# ===================================================================
# Módulo A — Servicio de Identidad y Autenticación
# ===================================================================
#
# Variables de entorno requeridas en producción (Azure App Service /
# Container Apps): DB_USER, DB_PASSWORD, DB_URL. Sin fallback a propósito:
# si faltan, la app no debe arrancar con una credencial por defecto.
#
# Variables opcionales (tienen default razonable, pero revisar por entorno):
# PORT, AZURE_VAULT_URL, MASTER_KEY_NAME, SIGNATURE_SERVICE_URL,
# IDENTITY_SERVICE_URL, ALLOW_INSECURE_ENCRYPTION_FALLBACK.

# 1. Puerto HTTP (8081 por defecto para Módulo A; Azure App Service/Container
#    Apps para contenedores inyecta el puerto vía la variable PORT)
quarkus.http.port=${PORT:8080}

# CORS: en Azure se reemplaza por el dominio real de Static Web Apps.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:8085}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=origin,content-type,accept,authorization,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# 2. Configuración de PostgreSQL
#    Sin fallback: en cualquier perfil que no sea "dev" la app debe fallar al
#    arrancar si no se define la credencial real por variable de entorno.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Solo en desarrollo local se permite un default (Postgres local genérico,
# no una credencial real).
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:labcom,2015}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tesis_db}

# Generación/sincronización de esquema: "update" es cómodo pero riesgoso en
# producción (puede alterar el esquema real sin control explícito). Se deja
# así porque el proyecto todavía no tiene una herramienta de migraciones
# (Flyway/Liquibase) — ver deuda técnica en el resumen de la Fase 4/5.
quarkus.hibernate-orm.database.generation=update
# El log de SQL solo debe estar activo en desarrollo (puede filtrar datos
# sensibles a los logs y tiene costo de performance).
%dev.quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.sql=false

# 3. Integración con APIs Externas (CA Simulator / Registro Civil)
signature-api/mp-rest/url=${SIGNATURE_SERVICE_URL:https://simulador-ca-ecuador-dhb6b2h9gbc6e2a2.eastus-01.azurewebsites.net/}
identity-api/mp-rest/url=${IDENTITY_SERVICE_URL:https://api-simulacion-registro-civil-evbgdua8hvgpfkht.eastus-01.azurewebsites.net}

# 4. Azure Key Vault & Master Key
tesis.azure.keyvault.url=${AZURE_VAULT_URL:https://tesis-forensic-vault.vault.azure.net/}
tesis.master-key.name=${MASTER_KEY_NAME:master-custody-key}
quarkus.devservices.enabled=false

# Cifrado: mientras Key Vault no tenga Managed Identity/acceso configurado en
# Azure, se permite un fallback local INSEGURO si Key Vault no responde (ver
# VaultEncryptionService). Cambiar a "false" en cuanto Key Vault esté
# operativo en el entorno de despliegue, para que un fallo real de Key Vault
# no cifre silenciosamente con una llave débil.
tesis.encryption.allow-insecure-fallback=${ALLOW_INSECURE_ENCRYPTION_FALLBACK:false}
%dev.tesis.encryption.allow-insecure-fallback=${ALLOW_INSECURE_ENCRYPTION_FALLBACK:true}

# 5. Límite de carga de archivos multipart. Un .p12 típico pesa unos pocos
#    KB; 10M deja margen amplio sin exponer al servicio a subidas enormes
#    (antes: 500M, un vector de agotamiento de memoria/disco innecesario).
quarkus.http.limits.max-body-size=10M

# 6. JWT: Módulo A firma el token en el login. La llave privada NO vive en el
#    repo: es una Key RSA-2048 en Azure Key Vault (Token-JWT-sistema-forense-1),
#    firmada remotamente en JwtTokenIssuer vía CryptographyClient — nunca sale
#    del vault. La llave pública sí se versiona (no es secreta) y se
#    distribuye igual a Módulo B para verificar la firma. El emisor (issuer)
#    debe coincidir en los tres lugares que lo usan: aquí, en JwtTokenIssuer y
#    en el application.properties de Módulo B.
mp.jwt.verify.issuer=https://modulo-validar.tesis.local
mp.jwt.verify.publickey.location=publicKey.pem
tesis.jwt.key-name=${JWT_KEY_NAME:Token-JWT-sistema-forense-1}
smallrye.jwt.new-token.lifespan=3600

# 7. Índice ciego de la cédula (ver BlindIndexService): HMAC-SHA256 con esta
#    llave permite buscar/deduplicar por cédula sin guardarla en texto plano.
#    Sin fallback en producción a propósito, igual que DB_PASSWORD: si falta
#    la variable de entorno CEDULA_HMAC_SECRET, la app no debe arrancar con
#    una llave débil por defecto.
tesis.cedula.hmac-secret=${CEDULA_HMAC_SECRET}
%dev.tesis.cedula.hmac-secret=${CEDULA_HMAC_SECRET:dev-only-insecure-hmac-secret-cambiar-en-produccion}
